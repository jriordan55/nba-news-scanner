name: scan

on:
  schedule:
    # Every 30 minutes, off the top of the hour so GitHub is less likely to
    # delay it. Each run is billed as at least one minute, and a free private
    # repo includes 2,000 minutes a month. This cadence stays inside that
    # allowance. The shortest cron GitHub allows is 5 minutes.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nba-news-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Scan once
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LOOKBACK_HOURS: "12"
          MAX_TIP_HOURS: "96"
        run: python -u scanner.py --once

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/clv.csv data/scanner.sqlite3
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update scan state"
          git push

      - name: Confirm Discord on a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({
                  "content": "NBA news scanner is running on GitHub every 30 minutes, including when the PC is off."
              }).encode(),
              headers={"Content-Type": "application/json", "User-Agent": "nba-news-scanner"},
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("discord", response.status)
          except Exception as exc:
              print("discord failed", type(exc).__name__)
              raise SystemExit(1)
          PY
